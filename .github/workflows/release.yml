name: Build and Release

# Only runs on branches named rel-* (e.g. rel-1.2.0) - every push to one of
# those builds the .fap and publishes/updates a GitHub Release named after
# the branch, with the .fap attached. workflow_dispatch is there so a
# rel-* branch can be re-released on demand without an empty commit.
#
# Nothing here names the app. Everything comes from application.fam by way of
# the Makefile's print-* targets, so this file can be copied to another Flipper
# app as-is.
on:
  push:
    branches:
      - "rel-*"
  workflow_dispatch:

permissions:
  contents: write # needed to create/update releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abandon a release mid-publish

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # This repo pulls in the milesTag Arduino library as a submodule (a
          # reference to https://github.com/ncmreynolds/milesTag rather than
          # content copied in here). It is protocol reference material and is
          # deliberately excluded from the build, but checking it out keeps the
          # tree identical to a local clone. Harmless in a repo with no
          # submodules, which is why it stays in the template.
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Identify the app
        id: app
        run: |
          set -euo pipefail

          # The Makefile reads these out of application.fam. Assigning first (and
          # checking) rather than echoing the substitutions straight into
          # GITHUB_OUTPUT: a failure inside $(...) would not fail the echo, and
          # an empty appid would quietly produce a "-rel-x.y.z.fap" asset.
          APP_ID="$(make -s print-appid)"
          APP_NAME="$(make -s print-name)"
          APP_VERSION="$(make -s print-version)"

          if [ -z "$APP_ID" ]; then
            echo "::error::could not read appid from application.fam"
            exit 1
          fi
          echo "Building $APP_NAME ($APP_ID) version $APP_VERSION"

          {
            echo "id=$APP_ID"
            echo "name=${APP_NAME:-$APP_ID}"
            echo "version=$APP_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Install build toolchain (ufbt + Flipper SDK)
        run: make setup

      - name: Build the .fap
        run: make build

      - name: Stage the build output
        id: fap
        run: |
          set -euo pipefail

          # ufbt builds into ~/.ufbt/build/<appid>.fap, a per-user cache shared
          # by every ufbt app - not into the working directory.
          BUILT="$(make -s print-fap)"
          if [ ! -f "$BUILT" ]; then
            echo "::error::$BUILT not found after build"
            ls -la "$HOME/.ufbt/build" || true
            exit 1
          fi

          # Give the release asset a self-describing name; the cache filename is
          # just the appid and says nothing about which release it came from.
          mkdir -p dist
          ASSET="dist/${{ steps.app.outputs.id }}-${GITHUB_REF_NAME}.fap"
          cp "$BUILT" "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload the .fap as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.id }}-${{ github.ref_name }}
          path: ${{ steps.fap.outputs.asset }}
          if-no-files-found: error

      - name: Create or update the GitHub Release for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ASSET="${{ steps.fap.outputs.asset }}"
          TITLE="${{ steps.app.outputs.name }} ${TAG}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - replacing its .fap asset"
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating new release $TAG"
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --generate-notes
          fi
